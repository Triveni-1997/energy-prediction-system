{% extends "base.html" %}
{% block title %}Register - Energy Prediction{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card p-4 mt-4">
            <h3 class="mb-3 text-center">Create Account</h3>
            <div id="alertBox"></div>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="full_name" class="form-control" placeholder="Jane Doe">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required>
            </div>

            <button id="registerBtn" class="btn btn-primary w-100">Register</button>

            <p class="text-center mt-3 mb-0">
                Already have an account? <a href="/login">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("registerBtn").addEventListener("click", async () => {
    const full_name = document.getElementById("full_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const alertBox = document.getElementById("alertBox");
    alertBox.innerHTML = "";

    if (!email || !password) {
        alertBox.innerHTML = '<div class="alert alert-warning">Email and password are required.</div>';
        return;
    }
    if (password.length < 6) {
        alertBox.innerHTML = '<div class="alert alert-warning">Password must be at least 6 characters.</div>';
        return;
    }

    try {
        const data = await apiFetch("/api/auth/register", {
            method: "POST",
            body: JSON.stringify({ email, password, full_name })
        });
        setToken(data.token);
        setUser(data.user);
        window.location.href = "/dashboard";
    } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
    }
});
</script>
{% endblock %}
